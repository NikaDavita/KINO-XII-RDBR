<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kino XII</title>
  <meta name="description" content="Kino XII cinema network: now playing, coming soon and tickets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.kinoxii.redberryinternship.ge">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/home.css">
  <script type="module" src="js/home.js"></script>
</head>
<body class="page-home">
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero" id="hero" aria-label="Featured films">
      <div class="hero__slides"></div>
      <div class="hero__shade"></div>
      <div class="container hero__inner">
        <div class="hero__content">
          <div class="hero__placeholder" aria-hidden="true">
            <span class="skeleton skeleton--text" style="width: 220px"></span>
            <span class="skeleton skeleton--title"></span>
            <span class="skeleton skeleton--text" style="width: 600px"></span>
            <span class="skeleton skeleton--text" style="width: 480px"></span>
          </div>
        </div>
        <div class="hero__controls">
          <div class="hero__progress"></div>
          <div class="hero__arrows">
            <button type="button" class="round-btn" data-hero-prev aria-label="Previous film">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button type="button" class="round-btn" data-hero-next aria-label="Next film">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="section section--recent" id="recent-section" hidden>
      <div class="container">
        <div class="section__head">
          <h2 class="section__title section__title--plain">Recently viewed</h2>
        </div>
      </div>
      <div class="container">
        <div class="card-row card-row--recent"></div>
      </div>
    </section>

    <section class="section" id="now-playing">
      <div class="container">
        <div class="section__head">
          <h2 class="section__title">Now Playing</h2>
          <a class="section__link" href="sessions.html">See all</a>
        </div>
      </div>
      <div class="container">
        <div class="card-row card-row--movies"></div>
      </div>
    </section>

    <section class="section" id="coming-soon">
      <div class="container">
        <div class="section__head">
          <h2 class="section__title">Coming Soon...</h2>
          <a class="section__link" href="">See all</a>
        </div>
      </div>
      <div class="container">
        <div class="card-row card-row--soon"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
